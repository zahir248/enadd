<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-label="Logistics illustration">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1a5a73"/>
      <stop offset="0.55" stop-color="#226e8c"/>
      <stop offset="1" stop-color="#2a8aad"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#e86738"/>
      <stop offset="1" stop-color="#f08a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0b2530" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="720" rx="36" fill="url(#bg)"/>
  <path d="M96 470 C 220 360, 390 590, 550 470 S 875 360, 1104 490" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="6" stroke-linecap="round" stroke-dasharray="18 20"/>
  <circle cx="96" cy="470" r="10" fill="#ffffff" opacity="0.55"/>
  <circle cx="1104" cy="490" r="10" fill="#ffffff" opacity="0.55"/>

  <!-- Warehouse -->
  <g filter="url(#shadow)" transform="translate(120 250)">
    <rect x="0" y="90" width="320" height="230" rx="20" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <path d="M30 120 L160 50 L290 120" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="10" stroke-linejoin="round"/>
    <rect x="70" y="180" width="180" height="140" rx="14" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <path d="M80 210 H240" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <path d="M80 250 H240" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <path d="M80 290 H240" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <rect x="22" y="320" width="276" height="18" rx="9" fill="rgba(232,103,56,0.35)"/>
  </g>

  <!-- Container ship -->
  <g filter="url(#shadow)" transform="translate(530 290)">
    <path d="M40 220 H520 L485 270 H110 C78 270 52 252 40 220Z" fill="rgba(255,255,255,0.16)" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>
    <rect x="120" y="78" width="64" height="84" rx="10" fill="rgba(255,255,255,0.18)"/>
    <rect x="190" y="90" width="36" height="72" rx="10" fill="rgba(255,255,255,0.18)"/>
    <rect x="80" y="150" width="420" height="70" rx="16" fill="rgba(0,0,0,0.10)"/>
    <g transform="translate(100 106)">
      <rect x="0" y="0" width="90" height="52" rx="10" fill="rgba(232,103,56,0.70)"/>
      <rect x="100" y="0" width="90" height="52" rx="10" fill="rgba(255,255,255,0.16)"/>
      <rect x="200" y="0" width="90" height="52" rx="10" fill="rgba(232,103,56,0.55)"/>
      <rect x="300" y="0" width="90" height="52" rx="10" fill="rgba(255,255,255,0.14)"/>
    </g>
    <g transform="translate(115 54)">
      <rect x="0" y="0" width="90" height="46" rx="10" fill="rgba(255,255,255,0.16)"/>
      <rect x="100" y="0" width="90" height="46" rx="10" fill="rgba(232,103,56,0.45)"/>
      <rect x="200" y="0" width="90" height="46" rx="10" fill="rgba(255,255,255,0.12)"/>
      <rect x="300" y="0" width="90" height="46" rx="10" fill="rgba(232,103,56,0.35)"/>
    </g>
    <path d="M70 250 H480" stroke="rgba(232,103,56,0.75)" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Trucks -->
  <g filter="url(#shadow)" transform="translate(330 500)">
    <rect x="0" y="40" width="250" height="90" rx="18" fill="rgba(255,255,255,0.18)"/>
    <rect x="170" y="0" width="120" height="130" rx="20" fill="rgba(255,255,255,0.16)"/>
    <rect x="192" y="24" width="72" height="40" rx="10" fill="rgba(0,0,0,0.12)"/>
    <path d="M24 86 H146" stroke="url(#accent)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="70" cy="140" r="22" fill="rgba(0,0,0,0.22)"/>
    <circle cx="70" cy="140" r="10" fill="rgba(255,255,255,0.25)"/>
    <circle cx="210" cy="140" r="22" fill="rgba(0,0,0,0.22)"/>
    <circle cx="210" cy="140" r="10" fill="rgba(255,255,255,0.25)"/>
  </g>

  <!-- Title strip -->
  <g transform="translate(220 72)">
    <rect width="760" height="84" rx="20" fill="rgba(255,255,255,0.10)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
    <text x="380" y="54" text-anchor="middle" font-size="34" font-family="Outfit, DM Sans, system-ui, -apple-system, Segoe UI, sans-serif" fill="#ffffff" font-weight="700">
      Freight • FTZ • Trucking • Marine
    </text>
  </g>
</svg>

